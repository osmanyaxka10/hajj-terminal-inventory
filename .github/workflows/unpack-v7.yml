name: Unpack ChatGPT V7 source

on:
  push:
    branches:
      - chatgpt-v7

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event.head_commit.message != 'Unpack V7 source' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-v7
          fetch-depth: 0

      - name: Rebuild and unpack source archive
        shell: bash
        run: |
          cat .source-chunks/part-* > source.b64
          base64 -d source.b64 > source.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('source.zip') as z:
              z.extractall('.')
          PY
          rm -rf .source-chunks source.b64 source.zip trigger.txt

      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack V7 source"
          git push origin chatgpt-v7
