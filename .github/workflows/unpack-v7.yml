name: Unpack ChatGPT V7 source

on:
  push:
    branches:
      - chatgpt-v7

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event.head_commit.message != 'Unpack V7 source' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-v7
          fetch-depth: 0

      - name: Unpack source archive
        shell: bash
        run: |
          if [ ! -f source.zip ]; then
            echo "No source.zip present; nothing to unpack."
            exit 0
          fi
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('source.zip') as z:
              z.extractall('.')
          PY
          rm source.zip

      - name: Commit unpacked source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack V7 source"
          git push origin chatgpt-v7
